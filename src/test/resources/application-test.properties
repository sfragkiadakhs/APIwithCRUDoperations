# Configuration used only by integration tests (@ActiveProfiles("test")).
# Points at an in-memory H2 database instead of MySQL so tests are
# self-contained and don't require a running database or Docker daemon.
spring.datasource.url=jdbc:h2:mem:library_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

logging.level.com.askisi5.app.rest=INFO
